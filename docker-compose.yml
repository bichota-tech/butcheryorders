version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: butchery_postgres
    environment:
      POSTGRES_USER: butchery
      POSTGRES_PASSWORD: ${DB_PASSWORD:-butchery123}
      POSTGRES_DB: butcheryorders
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U butchery"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - butchery_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: butchery_backend
    environment:
      DATABASE_URL: postgresql://butchery:${DB_PASSWORD:-butchery123}@postgres:5432/butcheryorders
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret}
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3100
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports:
      - "3100:3100"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - butchery_network
    command: sh -c "npx prisma migrate deploy && npm start"
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  butchery_network:
    driver: bridge
